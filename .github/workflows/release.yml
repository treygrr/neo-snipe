name: Release

# Tag a version to cut a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      # Tests are run locally before a release is cut, so this only builds.
      - name: Build the Chrome extension
        run: npm run release

      - uses: actions/upload-artifact@v4
        with:
          name: neo-snipe-extensions
          path: extension/release/
          if-no-files-found: error

      - name: Attach zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/release/*.zip
          body: |
            Download the zip, unzip it, and follow the README inside:
            `chrome://extensions` → Developer mode → Load unpacked.

            Updating from an earlier version? Back your settings up first: panel → cog →
            Backup → **Save file**. See the README for when your data is kept.
