<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4b8bff"/>
      <stop offset="0.55" stop-color="#2554d8"/>
      <stop offset="1" stop-color="#152a86"/>
    </linearGradient>
    <linearGradient id="coin" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffe98c"/>
      <stop offset="0.5" stop-color="#f9bf3b"/>
      <stop offset="1" stop-color="#d2870f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd3ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect width="128" height="128" rx="29" fill="url(#sheen)"/>

  <!-- handle, drawn first so the lens covers the join -->
  <g class="detail">
    <rect x="80" y="80" width="16" height="44" rx="8"
          transform="rotate(-45 88 102)" fill="#0b1a52" opacity=".45"/>
  </g>
  <rect x="81" y="78" width="13" height="41" rx="6.5"
        transform="rotate(-45 87.5 98.5)" fill="url(#steel)"/>

  <!-- lens -->
  <circle class="detail" cx="54" cy="54" r="36" fill="#0b1a52" opacity=".38"/>
  <circle cx="54" cy="54" r="34.5" fill="none" stroke="url(#steel)" stroke-width="11.5"/>

  <!-- the coin under the glass -->
  <circle cx="54" cy="54" r="27" fill="url(#coin)"/>
  <circle class="detail" cx="54" cy="54" r="27" fill="none" stroke="#9a5f05" stroke-width="2" opacity=".45"/>
  <circle class="detail" cx="54" cy="54" r="20.5" fill="none" stroke="#9a5f05" stroke-width="1.6" opacity=".35"/>

  <!-- NP, the thing you are actually looking at -->
  <text class="detail" x="54" y="63.5" text-anchor="middle"
        font-family="Verdana, DejaVu Sans, sans-serif" font-size="23" font-weight="700"
        fill="#7d4d03" opacity=".85">NP</text>

  <!-- glint on the glass -->
  <path class="detail" d="M36 44a22 22 0 0 1 13-13" stroke="#fff" stroke-width="5.5" fill="none"
        stroke-linecap="round" opacity=".5"/>
</svg>
